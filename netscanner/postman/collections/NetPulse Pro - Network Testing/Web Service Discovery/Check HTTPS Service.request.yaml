$kind: http-request
method: GET
url: 'https://{{targetHost}}'
order: 2000
settings:
  strictSSL: false
  followRedirects: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Test 1: HTTPS service is up
      pm.test("HTTPS service is reachable", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 301, 302, 304]);
      });

      // Test 2: Response time check
      pm.test("Response time is acceptable", function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
